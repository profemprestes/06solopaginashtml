<section
          id="cotizador-form"
          class="relative z-10 bg-white font-sans border-t border-brand-blue-100"
        >
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 lg:py-28">
            <div class="max-w-3xl mx-auto text-center space-y-5 mb-4">
              <span

              >
                Contanos del envío
              </span>
              <h2
                class="text-brand-blue-500 font-display text-4xl sm:text-5xl uppercase leading-[0.95] tracking-tight"
              >
                Sin registro · Sin llamadas
              </h2>
              <p
                class="text-brand-blue-500 text-base sm:text-lg font-sans leading-relaxed font-medium"
              >
                Con el origen y el destino alcanzamos el precio de los dos
                servicios.
              </p>
            </div>
            <form

              data-testid="cotizador-main-form"

              novalidate
            >
              <div class="input-wrapper flex flex-col w-full">
                <label for="origen" class="input-label">
                  <span>
                    Dirección de Origen (Retiro)
                    <span class="text-danger ml-1">*</span>
                  </span>
                </label>
                <div class="relative flex items-center w-full">
                  <div class="input-icon">
                    <svg
                      viewBox="0 0 24 24"
                      class="lucide lucide-map-pin h-4 w-4"
                      aria-hidden="true"
                    >
                      <path
                        d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
                      ></path>
                      <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                  </div>
                  <input
                    id="origen"
                    name="origen"
                    type="text"
                    required
                    class="input-field"
                    placeholder="Ej: Friuli 1972"
                    value=""
                  />
                </div>
              </div>
              <div class="input-wrapper flex flex-col w-full">
                <label for="destino" class="input-label">
                  <span>
                    Dirección de Destino (Entrega)
                    <span class="text-danger ml-1">*</span>
                  </span>
                </label>

                  <div class="input-icon">
                    <svg
                      viewBox="0 0 24 24"
                      class="lucide lucide-map-pin h-4 w-4"
                      aria-hidden="true"

                    id="destino"

                    type="text"
                    required

                    placeholder="Ej: Av. Luro 3200"
                    value=""

                </div>
              </div>

                      name="telefono"
                      type="tel"
                      required
                      class="input-field"
                      placeholder="223 555-1234"
                      value=""

              </div>

                <label for="contenido" class="input-label">
                  <span>

                    <span class="text-danger ml-1">*</span>

                      aria-hidden="true"

                    </svg>
                  </div>
                  <input
                    id="contenido"
                    name="contenido"
                    type="text"
                    required
                    class="input-field"
                    placeholder="Ej: Documentos · 1 bulto de 2 kg"
                    value=""
                  />
                </div>
              </div>
              <div class="pt-1">
                <button
                  type="submit"
                  class="cta-nested-pill group inline-flex items-center justify-between gap-3 rounded-full font-subheading uppercase tracking-[.05em] font-bold transition-all duration-200 cursor-pointer focus:outline-none select-none border px-8 py-3.5 text-base min-h-[52px] bg-brand-yellow-500 text-brand-blue-500 border-brand-yellow-500 shadow-accent-sm hover:shadow-cta-glow hover:bg-brand-yellow-400 active:scale-[.98] w-full"
                >
                  <span class="truncate">Ver las dos tarifas</span>
                  <span
                    class="cta-nested-icon w-8 h-8 rounded-full flex items-center justify-center shrink-0 transition-all duration-200 bg-transparent text-brand-blue-500 group-hover:bg-brand-blue-500 group-hover:text-brand-yellow-500 group-hover:translate-x-1"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      class="lucide lucide-arrow-right w-4 h-4"
                      aria-hidden="true"
                    >
                      <path d="M5 12h14"></path>
                      <path d="m12 5 7 7-7 7"></path>
                    </svg>
                  </span>
                </button>
              </div>
              <p
                class="text-xs font-sans text-brand-blue-500 leading-relaxed text-center pt-1"
              >
                Las tarifas salen de nuestra tabla vigente. El pedido se
                confirma por WhatsApp.
              </p>
            </form>
            <div
              id="cotizador-status"
              class="hidden max-w-3xl mx-auto mt-4 rounded-[30px] border border-brand-blue-100 bg-white p-6 sm:p-8 shadow-sm"
              aria-live="polite"
            ></div>
          </div>
        </section>
